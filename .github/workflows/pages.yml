name: Publish website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'auth-worker/**'
      - 'docs/**'
      - 'tests/**'
      - '*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files only
        run: |
          mkdir -p _site
          cp index.html style.css script.js content-utils.mjs .nojekyll _site/
          cp -R assets content admin _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
