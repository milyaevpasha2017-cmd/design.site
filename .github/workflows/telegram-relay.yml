name: Publish Telegram relay
on:
  push:
    branches: [main]
    paths: ['telegram-relay/**', '.github/workflows/telegram-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-relay-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/telegram-relay.test.mjs tests/telegram-transport.test.mjs
      - run: npm ci --prefix site-worker --ignore-scripts
      - run: node tests/browser/telegram-relay-workerd.mjs
      - run: npm exec --prefix site-worker -- wrangler deploy --config telegram-relay/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
