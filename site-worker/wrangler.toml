name = "epiphany-interior-site"
main = "src/entry.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "../_site-cloudflare"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
SITE_ORIGIN = "https://epiphany-int.ru"
CONTENT_REPO = "milyaevpasha2017-cmd/design.site"
CONTENT_BRANCH = "main"
ADMIN_USERNAME = "admin"
# Secrets: ADMIN_PASSWORD_HASH and GITHUB_CONTENT_TOKEN. Never commit values.

[[durable_objects.bindings]]
name = "ADMIN_STATE"
class_name = "AdminState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdminState"]

# Add the custom domain in Cloudflare after the domain is Active and this
# deployment has passed its preview check. Existing GitHub Pages stays online.
