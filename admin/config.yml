- name: projects
  label: Проекты портфолио
  label_singular: Проект
  folder: content/projects
  create: true
  delete: true
  extension: json
  format: json
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{title}} · {{slug}}'
  sortable_fields:
  - order
  - title
  fields:
  - name: slug
    label: Адрес проекта (латиницей)
    widget: string
    hint: 'Например: warm-minimalism. Не меняйте после публикации, чтобы сохранить ссылки.'
    pattern:
    - ^[a-z0-9]+(?:-[a-z0-9]+)*$
    - Только строчные латинские буквы, цифры и дефисы.
  - name: order
    label: Порядок в портфолио
    widget: number
    default: 10
    value_type: int
    min: 0
  - name: published
    label: Опубликовать на сайте
    widget: boolean
    default: true
  - name: title
    label: Название
    widget: string
  - name: subtitle
    label: Короткая подпись
    widget: string
  - name: description
    label: Описание
    widget: text
  - name: image
    label: Обложка
    widget: image
  - name: image_alt
    label: Описание обложки для доступности
    widget: string
  - name: is_concept
    label: Это демонстрационная концепция
    widget: boolean
    default: false
    required: false
  - name: images
    label: Дополнительные фотографии
    widget: list
    required: false
    fields:
    - name: image
      label: Фотография
      widget: image
    - name: alt
      label: Описание фотографии
      widget: string
  - name: seo_description
    label: Описание для поисковиков
    widget: text
  - name: body
    label: 'Подробная история проекта: абзацы'
    widget: list
    required: false
    field:
      name: paragraph
      label: Абзац
      widget: text
  - name: location
    label: Город / местоположение
    widget: string
    required: false
  - name: area
    label: Площадь
    widget: string
    required: false
    hint: 'Например: 85 м²'
  - name: year
    label: Год
    widget: string
    required: false
